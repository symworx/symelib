# Day-to-day CI.
# SymWorx org standard (default branch `worx`).
# See DEVELOPMENT.md for additional information

name: CI

on:
  push:
    branches: [worx, develop]
  pull_request:
    branches: [worx, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dev tools
        run: uv sync --group dev --no-install-project

      - name: Ruff format check
        run: uv run --group dev ruff format --check .

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync project + dev
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run --group dev ruff check .

      - name: Pytest
        run: uv run --group dev pytest
