[project]
name = "symworx-elibrary"
version = "0.2.1"
description = "Foundation for a local paper management system with agentic capabilities"
requires-python = ">=3.13"
authors = [
    { name = "Nathaniel T. Berry" },
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
    "PyPDF2>=3.0",
    "textual>=1.0",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pgvector",
]
agents = [
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-postgres>=0.4.0",
    "llama-index-llms-ollama>=0.5.0",
    "llama-index-embeddings-huggingface>=0.5.0",
    "llama-index-readers-file>=0.4.0",
    # Runtime requirements for Postgres + pgvector vector store (shared with [db])
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pgvector",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[project.scripts]
elib = "symworx_elibrary.main:runner"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symworx_elibrary = ["tui/*.tcss", "tui/**/*.tcss"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
# Configuration moved to ruff.toml
